name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- src/main/resources/static/css src/main/resources/static/vendor
      - run: bash gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dazbones-site:ci .
      - run: docker tag dazbones-site:ci dazbones-site:local
      - run: docker build -f deploy/mysql.Dockerfile -t dazbones-mysql:local .
      - run: docker build -f deploy/proxy.Dockerfile -t dazbones-proxy:local .
      - shell: pwsh
        run: ./deploy/Test-Deployment.ps1
      - shell: pwsh
        run: ./deploy/Scan-Images.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan
          path: build/security-scan/*.json
