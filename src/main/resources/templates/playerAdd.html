<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}"><head><title>選手追加 | DazBones</title></head><body><section class="px-4 py-6"><link rel="stylesheet" href="/css/input.css"><a href="/players">← 選手一覧</a><h1>選手情報</h1><p th:if="${errorMessage}" th:text="${errorMessage}"></p><form th:action="@{/players/add}" th:object="${playerForm}" method="post" enctype="multipart/form-data" class="input-card"><ul th:if="${#fields.hasAnyErrors()}"><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul><div th:if="${visible.name}" class="input-field"><label>名前</label><input type="text" th:field="*{name}"></div><div th:if="${visible.backNumber}" class="input-field"><label>背番号</label><input type="number" th:field="*{backNumber}" min="0"></div><div th:if="${visible.throwHand}" class="input-field"><label>投げ</label><select th:field="*{throwHand}"><option value="">未選択</option><option value="右">右</option><option value="左">左</option><option value="両">両</option></select></div><div th:if="${visible.batHand}" class="input-field"><label>打ち</label><select th:field="*{batHand}"><option value="">未選択</option><option value="右">右</option><option value="左">左</option><option value="両">両</option></select></div><div th:if="${visible.positions}" class="input-field"><label>守備位置</label><label><input type="checkbox" th:field="*{positions}" value="投手"> 投手</label><label><input type="checkbox" th:field="*{positions}" value="捕手"> 捕手</label><label><input type="checkbox" th:field="*{positions}" value="内野手"> 内野手</label><label><input type="checkbox" th:field="*{positions}" value="外野手"> 外野手</label></div><div th:if="${visible.atBats}" class="input-field"><label>打数</label><input type="number" th:field="*{atBats}" min="0"></div><div th:if="${visible.hits}" class="input-field"><label>安打</label><input type="number" th:field="*{hits}" min="0"></div><div th:if="${visible.comment}" class="input-field"><label>コメント</label><input type="text" th:field="*{comment}"></div><div th:if="${visible.image}" class="input-field"><label>写真</label><input type="file" name="imageFile" accept=".jpg,.jpeg,.png,.webp"><small>5MB以内。未選択なら現在の写真を保持します。</small></div><button class="primary" type="submit">保存する</button></form></section></body></html>
