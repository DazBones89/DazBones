<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}"><head><title>表示設定 | DazBones</title></head><body><section class="px-4 py-6"><link rel="stylesheet" href="/css/input.css"><h1>選手項目の表示設定</h1><p>チェックを外すと、master以外の閲覧・登録・編集画面から非表示になります。</p><form th:each="entry:${labels}" class="auto-setting input-card" th:action="@{/admin/player-settings}" method="post"><input type="hidden" name="field" th:value="${entry.key}"><label><input type="checkbox" name="visible" th:checked="${fields[entry.key]}"> <span th:text="${entry.value}"></span></label><output aria-live="polite"></output></form><script src="/js/settings.js" defer></script></section></body></html>
