<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>連絡先 | DazBones</title></head>
<body><section class="px-4 py-6">
<link rel="stylesheet" href="/css/input.css">
<h1>連絡先</h1>
<p th:if="${message}" th:text="${message}" role="status"></p>
<p th:if="${error}" th:text="${error}" role="alert"></p>
<div class="input-card" style="white-space: pre-wrap; overflow-wrap: anywhere;" th:text="${contactText}"></div>
<p th:if="${#strings.isEmpty(contactText)}">連絡先はまだ登録されていません。</p>
<form class="input-card" th:if="${userSession != null and userSession.isMaster()}" th:action="@{/admin/contact}" method="post">
<h2>連絡先を編集</h2>
<label for="contactText">代表者名・メールアドレスなど</label>
<textarea id="contactText" name="contactText" rows="8" maxlength="5000" th:text="${contactText}"></textarea>
<p class="muted">入力した内容は、改行を含めて一般公開されます。</p>
<button class="primary" type="submit">保存</button>
</form>
</section></body></html>
