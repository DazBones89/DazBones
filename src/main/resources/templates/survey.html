<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">

<head><title>アンケート | DazBones</title></head>

<body>
<section class="px-4 py-6">
    <nav aria-label="アンケートの種類" class="mb-5 grid grid-cols-2 gap-2 text-center text-sm font-bold">
        <a th:href="@{/survey}" aria-current="page" class="rounded-xl db-bg-brown px-3 py-3 text-white">その他アンケート</a>
        <a th:href="@{/survey/attendance}" class="rounded-xl border px-3 py-3">出席アンケート</a>
    </nav>
    <script src="/vendor/fullcalendar-6.1.10.min.js"></script>

    <style>
        .fc-daygrid-day.survey-auto {
            background-color: #fde68a !important;
        }

        .fc-daygrid-day.survey-manual {
            background-color: #7dd3fc !important;
        }

        .fc-daygrid-day.survey-mixed {
            background: linear-gradient(
                to bottom,
                #fde68a 0%,
                #fde68a 50%,
                #7dd3fc 50%,
                #7dd3fc 100%
            ) !important;
        }

        .fc-daygrid-day.survey-none {
            background-color: #ffffff !important;
        }

        .fc .fc-daygrid-day-number {
            font-weight: 700;
            color: #3b2416;
        }

        .fc-event {
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 4px;
        }
    </style>


    <div class="mb-5">
        <h1 class="text-2xl font-black db-brown">アンケート</h1>
        <p class="mt-1 text-sm text-gray-500">出欠状況をカレンダーで確認できます</p>
    </div>

    <div class="mb-4 grid grid-cols-2 gap-2 text-sm font-bold">
        <a th:if="${userSession.canManage()}" th:href="@{/admin/survey-members}" class="rounded-xl border px-4 py-3 text-center">
            回答者管理
        </a>

        <a th:if="${userSession != null and userSession.isAdmin()}"
           th:href="@{/admin/holidays}"
           class="rounded-xl border px-4 py-3 text-center">
            祝日管理
        </a>
    </div>

    <div class="mb-4 rounded-2xl bg-white p-4 shadow-md ring-1 ring-gray-100">
        <p class="mb-2 text-sm font-bold db-brown">現在の回答者</p>

        <select th:disabled="${!userSession.isAdmin()}" id="globalMemberSelect" class="w-full rounded-xl border px-4 py-3">
            <option value="">未選択</option>
            <option th:each="member : ${members}"
                    th:value="${member.id}"
                    th:text="${member.name}"
                    th:selected="${selectedSurveyMemberId != null and selectedSurveyMemberId == member.id}">
                山田 太郎
            </option>
        </select>

        <p class="mt-2 text-xs text-gray-500">
            本人の専用ログインIDで回答します。管理者のみ他のメンバーの代理回答が可能です。
        </p>
    </div>

    <p th:if="${!userSession.isAdmin() and userSession.memberId == null}" class="mb-4 rounded-xl bg-yellow-50 p-3 text-sm">共有コードでは閲覧のみ可能です。回答には管理者が発行する本人専用のID・コードでログインしてください。</p>
    <p id="surveyMessage" role="status" aria-live="polite" class="mb-4 text-sm text-red-700"></p>
    <div class="mb-4 grid grid-cols-2 gap-2 text-xs font-bold">
        <div class="rounded-xl bg-yellow-200 px-3 py-2 text-center">土日祝：黄色</div>
        <div class="rounded-xl bg-sky-300 px-3 py-2 text-center">手動：水色</div>
        <div class="col-span-2 rounded-xl px-3 py-2 text-center"
             style="background: linear-gradient(to bottom, #fde68a 0%, #fde68a 50%, #7dd3fc 50%, #7dd3fc 100%);">
            土日祝＋手動：上半分黄色／下半分水色
        </div>
    </div>

    <div class="rounded-2xl bg-white p-3 shadow-md ring-1 ring-gray-100">
        <div id="surveyCalendar"></div>
    </div>

    <div id="surveyModal" role="dialog" aria-modal="true" aria-labelledby="modalDateTitle"
         class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/50 px-4">

        <div class="max-h-[90vh] w-full max-w-[430px] overflow-y-auto rounded-2xl bg-white shadow-xl">

            <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
                <div>
                    <h2 id="modalDateTitle" class="text-xl font-black db-brown">日付</h2>
                    <p id="modalSurveyTitle" class="text-xs text-gray-500">参加アンケート</p>
                </div>

                <button type="button"
                        onclick="closeSurveyModal()" aria-label="閉じる"
                        class="rounded-full bg-gray-100 px-3 py-1 text-xl font-bold text-gray-600">
                    ×
                </button>
            </div>

            <div class="space-y-4 px-5 py-5">
                <p id="modalMessage" role="status" aria-live="polite" class="text-sm text-red-700"></p>

                <div id="myAnswerBox" class="hidden rounded-xl bg-green-50 p-3 text-sm font-bold text-green-700">
                    現在の回答：<span id="myAnswerStatus"></span>
                </div>

                <div class="rounded-xl bg-gray-50 p-4">
                    <h3 class="mb-2 text-sm font-black db-gold">回答する</h3>

                    <input type="hidden" id="answerDate">

                    <label class="mb-1 block text-xs font-bold db-brown">名前</label>
                    <select th:disabled="${!userSession.isAdmin()}" id="answerMemberId" class="mb-3 w-full rounded-xl border px-4 py-3">
                        <option value="">選択してください</option>
                        <option th:each="member : ${members}"
                                th:value="${member.id}"
                                th:text="${member.name}">
                            山田 太郎
                        </option>
                    </select>

                    <label class="mb-1 block text-xs font-bold db-brown">回答</label>
                    <select id="answerStatus" class="mb-3 w-full rounded-xl border px-4 py-3">
                        <option value="参加">参加</option>
                        <option value="不参加">不参加</option>
                        <option value="未定">未定</option>
                    </select>

                    <label class="mb-1 block text-xs font-bold db-brown">コメント</label>
                    <textarea id="answerComment" maxlength="255"
                              rows="3"
                              class="mb-3 w-full rounded-xl border px-4 py-3"
                              placeholder="任意"></textarea>

                    <button type="button"
                            id="saveAnswerButton" data-survey-write onclick="submitSurveyAnswer()"
                            class="w-full rounded-xl db-bg-brown px-4 py-3 font-black text-white">
                        回答を保存
                    </button>
                </div>

                <div th:if="${userSession.isAdmin()}" class="rounded-xl bg-sky-50 p-4">
                    <h3 class="mb-2 text-sm font-black text-sky-700">手動アンケートを追加</h3>
                    <input type="text"
                           id="manualSurveyTitle" maxlength="100"
                           placeholder="例：追加アンケート"
                           class="mb-3 w-full rounded-xl border px-4 py-3">

                    <button type="button"
                            data-survey-write onclick="createManualSurvey()"
                            class="w-full rounded-xl bg-sky-500 px-4 py-3 font-black text-white">
                        この日付に追加
                    </button>
                    <button id="deleteManualButton" type="button" data-survey-write onclick="deleteManualSurvey()" class="hidden mt-3 w-full rounded-xl border border-red-500 p-3 text-red-700">手動アンケートを削除</button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="rounded-xl bg-green-50 p-3">
                        <h3 class="mb-2 text-sm font-black text-green-700">参加</h3>
                        <ul id="joinList" class="space-y-1 text-sm text-gray-700"></ul>
                    </div>

                    <div class="rounded-xl bg-red-50 p-3">
                        <h3 class="mb-2 text-sm font-black text-red-700">不参加</h3>
                        <ul id="absentList" class="space-y-1 text-sm text-gray-700"></ul>
                    </div>

                    <div class="rounded-xl bg-yellow-50 p-3">
                        <h3 class="mb-2 text-sm font-black text-yellow-700">未定</h3>
                        <ul id="undecidedList" class="space-y-1 text-sm text-gray-700"></ul>
                    </div>

                    <div class="rounded-xl bg-gray-50 p-3">
                        <h3 class="mb-2 text-sm font-black text-gray-700">未回答</h3>
                        <ul id="noAnswerList" class="space-y-1 text-sm text-gray-700"></ul>
                    </div>
                </div>

                <button type="button"
                        onclick="closeSurveyModal()" aria-label="閉じる"
                        class="w-full rounded-xl border px-4 py-3 font-bold">
                    閉じる
                </button>
            </div>
        </div>
    </div>



<script th:inline="javascript">
    const selectedMember = /*[[${selectedSurveyMemberId}]]*/ null;
    const isAdmin = /*[[${userSession.isAdmin()}]]*/ false;
    const ownMember = /*[[${userSession.memberId}]]*/ null;
    const csrfName = /*[[${_csrf.parameterName}]]*/ '';
    const csrfToken = /*[[${_csrf.token}]]*/ '';
    let surveyCalendar, busy = false, answerEnabled = false, detailSequence = 0, answerVersion = -1;
    const el = id => document.getElementById(id);
    function message(text) { el('surveyMessage').textContent = text; el('modalMessage').textContent = text; }
    async function request(url, options) {
        const r = await fetch(url, options);
        if (r.status === 401 || r.status === 403) throw new Error('権限がないかログインが切れています。ログイン状態を確認してください。');
        if (r.status === 409) throw new Error('他の画面で更新されました。画面を開き直して最新の回答を確認してください。');
        if (!r.ok) throw new Error('保存・取得に失敗しました。入力内容を確認して再試行してください。');
        const data = await r.json();
        if (data.success === false) throw new Error(data.message || '処理に失敗しました');
        return data;
    }
    function localDate(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function setBusy(value) {
        busy=value;
        document.querySelectorAll('[data-survey-write]').forEach(b=>b.disabled=value);
        el('saveAnswerButton').disabled=value || !answerEnabled;
    }
    async function backgrounds(start,end) {
        try {
            const types=await request('/api/survey/day-types?'+new URLSearchParams({start,end}));
            document.querySelectorAll('.fc-daygrid-day').forEach(cell=>{
                cell.classList.remove('survey-auto','survey-manual','survey-mixed','survey-none');
                cell.classList.add('survey-'+(types[cell.getAttribute('data-date')]||'none'));
            });
        } catch(e) { message(e.message); }
    }
    function renderNames(id,names) { el(id).replaceChildren(); (names.length?names:['なし']).forEach(name=>{const li=document.createElement('li');li.textContent=name;el(id).append(li);}); }
    async function loadDetail() {
        const sequence=++detailSequence;
        const params=new URLSearchParams({date:el('answerDate').value});
        const memberId=isAdmin?el('answerMemberId').value:ownMember;
        if(memberId)params.set('memberId',memberId);
        answerEnabled=false;setBusy(busy);
        try {
            const data=await request('/api/survey/detail?'+params);
            if(sequence!==detailSequence)return;
            el('modalSurveyTitle').textContent=data.title;
            ['参加','不参加','未定','未回答'].forEach((key,i)=>renderNames(['joinList','absentList','undecidedList','noAnswerList'][i],data[key]||[]));
            answerVersion=data.myVersion;
            el('answerStatus').value=data.myStatus||'参加';el('answerComment').value=data.myComment||'';
            el('myAnswerBox').classList.toggle('hidden',!data.myStatus);el('myAnswerStatus').textContent=data.myStatus||'';
            answerEnabled=!!data.canAnswer && (isAdmin || ownMember!==null);
            setBusy(busy);
            if(el('deleteManualButton'))el('deleteManualButton').classList.toggle('hidden',!data.manual);
            el('surveyModal').classList.remove('hidden');el('surveyModal').classList.add('flex');
        } catch(e){message(e.message);}
    }
    function openSurveyModal(date) {
        if(busy)return;
        message('');el('answerDate').value=date;el('modalDateTitle').textContent=date;
        el('answerMemberId').value=isAdmin?el('globalMemberSelect').value:(ownMember||'');
        if(el('manualSurveyTitle'))el('manualSurveyTitle').value='';loadDetail();
    }
    function closeSurveyModal(){if(busy)return;detailSequence++;el('surveyModal').classList.add('hidden');el('surveyModal').classList.remove('flex');}
    async function save(url,values) {
        if(busy)return;setBusy(true);message('');
        try {
            const params=new URLSearchParams(values);params.set(csrfName,csrfToken);
            await request(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params});
            surveyCalendar.refetchEvents();await backgrounds(localDate(surveyCalendar.view.activeStart),localDate(surveyCalendar.view.activeEnd));
            await loadDetail();message('保存しました。');
        } catch(e){message(e.message);} finally {setBusy(false);}
    }
    function submitSurveyAnswer(){
        const memberId=isAdmin?el('answerMemberId').value:ownMember;
        if(!memberId){message('回答者を選択してください。');return;}
        if(!answerEnabled)return;
        el('globalMemberSelect').value=memberId;
        save('/survey/answer',{date:el('answerDate').value,memberId,status:el('answerStatus').value,comment:el('answerComment').value,version:answerVersion});
    }
    function createManualSurvey(){save('/survey/manual',{date:el('answerDate').value,title:el('manualSurveyTitle').value});}
    function deleteManualSurvey(){if(confirm('手動アンケートを削除しますか？平日は回答も削除されます。土日祝は手動設定のみを削除し、自動アンケートと回答は残ります。'))save('/survey/manual/delete',{date:el('answerDate').value});}
    document.addEventListener('DOMContentLoaded',()=>{
        el('globalMemberSelect').value=selectedMember||'';
        surveyCalendar=new FullCalendar.Calendar(el('surveyCalendar'),{
            initialView:'dayGridMonth',locale:'ja',height:'auto',headerToolbar:{left:'prev,next today',center:'title',right:''},
            events:'/api/survey/events',eventSourceFailure:()=>message('アンケートを取得できませんでした。'),
            datesSet:info=>backgrounds(info.startStr,info.endStr),
            dayCellDidMount:info=>{info.el.tabIndex=0;info.el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===info.el){e.preventDefault();openSurveyModal(localDate(info.date));}});},
            dateClick:info=>{info.dayEl.focus();openSurveyModal(info.dateStr);},
            eventClick:info=>{info.el.tabIndex=0;info.el.focus();openSurveyModal(info.event.startStr);}
        });surveyCalendar.render();
        el('answerMemberId').addEventListener('change',loadDetail);
        document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSurveyModal();});
    });
</script>
</section></body></html>
