<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}"><head><title>SNS | DazBones</title></head><body><section class="px-4 py-6">
<link rel="stylesheet" href="/css/input.css"><h1>SNS</h1><p>チームの最新情報はこちらから。</p>
<p th:if="${message}" th:text="${message}" role="status"></p><p th:if="${error}" th:text="${error}" role="alert"></p>
<article class="input-card" th:each="link:${links}"><a class="social-link" th:href="${link.url}" target="_blank" rel="noopener noreferrer">
<span class="social-icon" aria-hidden="true"><svg th:if="${link.platform == 'Instagram'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><svg th:if="${link.platform == 'YouTube'}" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="5" fill="#f03"/><path d="M10 8L17 12L10 16Z" fill="white"/></svg><span th:if="${link.platform != 'Instagram' and link.platform != 'YouTube'}">↗</span></span>
<span><strong th:text="${link.platform}"></strong><br><span th:text="${link.account}"></span></span></a>
<form th:if="${userSession != null and userSession.canManage()}" th:action="@{/admin/social/delete}" method="post"><input type="hidden" name="id" th:value="${link.id}"><button class="danger" type="submit">リンクを削除</button></form></article>
<p th:if="${#lists.isEmpty(links)}">SNSはまだ登録されていません。</p>
<form class="input-card" th:if="${userSession != null and userSession.canManage()}" th:action="@{/admin/social/add}" method="post"><h2>SNSを追加</h2><label>SNSのアカウントURL<input type="url" name="url" maxlength="255" placeholder="https://www.instagram.com/dazbones89/" th:value="${submittedUrl}" required></label><p class="muted">Instagram・YouTubeなどのアカウントページを登録できます。</p><button class="primary" type="submit">追加</button></form>
</section></body></html>
