<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>個人年会費履歴 | DazBones</title></head><body><section class="px-4 py-6 space-y-4">
<a th:href="@{/fee}" class="underline">年会費管理へ</a><h1 class="text-2xl font-bold" th:text="${player.name}+'さんの年会費'"></h1>
<div class="rounded-xl bg-yellow-50 p-4"><h2 class="font-bold">個人累計（全年度）</h2>
<p th:text="'請求：'+${#numbers.formatInteger(totals.amount,1,'COMMA')}+'円'"></p>
<p th:text="'入金：'+${#numbers.formatInteger(totals.paidAmount,1,'COMMA')}+'円'"></p>
<p th:text="'未入金：'+${#numbers.formatInteger(totals.unpaidAmount,1,'COMMA')}+'円'"></p></div>
<p th:if="${rows.isEmpty()}">年会費の登録はありません。</p>
<article th:each="r:${rows}" class="rounded-xl border p-4 space-y-2">
<a th:href="@{/fee(year=${r.fiscalYear})}" th:text="${r.fiscalYear}+'年度'" class="font-bold underline"></a>
<p th:text="'請求：'+${#numbers.formatInteger(r.amount,1,'COMMA')}+'円'"></p>
<p th:text="'入金：'+${#numbers.formatInteger(r.paidAmount,1,'COMMA')}+'円'"></p>
<p th:text="'未入金：'+${#numbers.formatInteger(r.unpaidAmount,1,'COMMA')}+'円'"></p>
<p th:text="${r.comment}" class="whitespace-pre-line"></p></article>
</section></body></html>
