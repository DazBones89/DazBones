server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 60m
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import: optional:file:./config/local.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dazbones_db?serverTimezone=Asia/Tokyo}
    username: ${DB_USERNAME:dbuser}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  upload-dir: ${UPLOAD_DIR:uploads/images}
  auth:
    admin-code: ${ADMIN_CODE:}
    editor-code: ${EDITOR_CODE:}
