plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dazbones'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

// Security patches newer than the Spring Boot 4.0.8 dependency baseline.
// Revisit these overrides when upgrading Spring Boot.
ext['tomcat.version'] = '11.0.26'
ext['jackson-2-bom.version'] = '2.21.6'
ext['jackson-bom.version'] = '3.1.6'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 正しいMySQLドライバ（Spring Boot 3用）
    implementation 'com.mysql:mysql-connector-j'

    // ✅ バリデーション（@Valid, @NotBlank, @Size, @Min, @Max など）
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.2'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}
