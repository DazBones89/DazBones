services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dazbones
      MYSQL_USER: dazbones
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
      TZ: Asia/Tokyo
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [backend]
  app:
    build:
      context: ..
    image: dazbones-site:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/dazbones?serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
      DB_USERNAME: dazbones
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_CODE: ${ADMIN_CODE:?Set ADMIN_CODE}
      EDITOR_CODE: ${EDITOR_CODE:?Set EDITOR_CODE}
      UPLOAD_DIR: /data/images
      TZ: Asia/Tokyo
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - images:/data/images
    networks: [backend,frontend]
  proxy:
    image: caddy:2.9.1
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    networks: [frontend]
volumes:
  database:
  images:
  certificates:
  proxy_config:
networks:
  backend:
    internal: true
  frontend:
