# Use together with compose.oracle.yml after approving public web access.
services:
  proxy:
    image: dazbones-proxy:local
    restart: unless-stopped
    mem_limit: 96m
    depends_on: [app]
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  certificates:
  proxy_config:
